<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#171b1e" />
    <script>
      (function () {
        try {
          var c = localStorage.getItem("pixelplan.theme");
          var light = c === "light" || (c === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) {
            document.documentElement.setAttribute("data-theme", "light");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f3f5f7");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="PixelPlan" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Plan LED walls: data, power, rigging, cables, pick list and an engineering report." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PixelPlan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
