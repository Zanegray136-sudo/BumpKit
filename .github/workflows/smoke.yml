name: Smoke test

# Opens every page in a real browser. Runs beside the deploy, so a failure here is a warning
# that something broke, and never stops the site from updating.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
